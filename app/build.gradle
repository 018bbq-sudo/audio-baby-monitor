plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.audiobabymonitor'
    compileSdk 37

    defaultConfig {
        applicationId 'com.example.audiobabymonitor'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
